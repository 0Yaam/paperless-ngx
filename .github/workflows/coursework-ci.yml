name: Coursework CI
on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:
permissions:
  contents: read
env:
  DEFAULT_UV_VERSION: "0.12.x"
concurrency:
  group: coursework-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pbt-04:
    name: PBT-04 MIME-extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12 --group testing --frozen
      - name: Record environment
        run: |
          mkdir -p pbt-04-evidence
          git rev-parse HEAD > pbt-04-evidence/environment.txt
          uv run --python 3.12 --group testing --frozen python --version >> pbt-04-evidence/environment.txt
          uv pip freeze >> pbt-04-evidence/environment.txt
      - name: Run properties
        shell: bash
        run: |
          set -o pipefail
          uv run --python 3.12 --group testing --frozen pytest src/documents/tests/test_parsers.py -k TestMimeExtensionProperties -n 0 --hypothesis-seed=13 --hypothesis-show-statistics --junitxml=pbt-04-evidence/properties.xml 2>&1 | tee pbt-04-evidence/properties.log
      - name: Run parser regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          uv run --python 3.12 --group testing --frozen pytest src/documents/tests/test_parsers.py -n 0 --hypothesis-seed=13 --junitxml=pbt-04-evidence/regressions.xml 2>&1 | tee pbt-04-evidence/regressions.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pbt-04-evidence
          path: pbt-04-evidence/
          if-no-files-found: warn
  setup:
    name: Validate coursework setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check files and whitespace
        shell: bash
        run: |
          test -s README.md
          test -s docs/software-testing-project.md
          git diff --check HEAD^
  pbt-01:
    name: PBT-01 text normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12 --group testing --frozen
      - run: uv run --python 3.12 --dev --frozen pytest src/paperless/tests/test_parser_utils.py -k TestPostProcessText --hypothesis-seed=20261008
  pbt-02:
    name: PBT-02 Unicode search normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: 3.12
      - run: uv sync --python 3.12 --group testing --frozen
      - run: uv run --python 3.12 --dev --frozen pytest src/documents/tests/search/test_unicode_normalization.py -k TestTheNormalizer --hypothesis-seed=20261008
