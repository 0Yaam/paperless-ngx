name: Coursework CI
on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:
permissions:
  contents: read
env:
  DEFAULT_UV_VERSION: "0.12.x"
concurrency:
  group: coursework-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    name: Validate coursework setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check files and whitespace
        shell: bash
        run: |
          test -s README.md
          test -s docs/software-testing-project.md
          git diff --check HEAD^
  pbt-01:
    name: PBT-01 text normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12 --group testing --frozen
      - run: uv run --python 3.12 --dev --frozen pytest src/paperless/tests/test_parser_utils.py -k TestPostProcessText --hypothesis-seed=20261008
  pbt-02:
    name: PBT-02 Unicode search normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: 3.12
      - run: uv sync --python 3.12 --group testing --frozen
      - run: uv run --python 3.12 --dev --frozen pytest src/documents/tests/search/test_unicode_normalization.py -k TestTheNormalizer --hypothesis-seed=20261008
  pbt-03:
    name: PBT-03 path security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12 --group testing --frozen
      - name: Run PBT-03 and save evidence log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          uv run --python 3.12 --dev --frozen pytest src/documents/tests/test_path_security.py -k TestPathSecurity -v --hypothesis-seed=20261008 --hypothesis-show-statistics 2>&1 | tee .artifacts/pbt-03-run.log
      - name: Upload PBT-03 test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pbt-03-evidence
          path: .artifacts/pbt-03-run.log
  pbt-05:
    name: PBT-05 Parser selection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.DEFAULT_UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --python 3.12 --group testing --frozen
      - name: Run PBT-05 and save evidence log
        shell: bash
        run: |
          mkdir -p .artifacts
          uv run --python 3.12 --dev --frozen pytest src/paperless/tests/test_parser_selection_pbt.py -k TestPbtParserSelection -v --hypothesis-seed=20261008 --hypothesis-show-statistics 2>&1 | tee .artifacts/pbt-05-run.log
      - name: Upload PBT-05 test evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pbt-05-evidence
          path: .artifacts/pbt-05-run.log
